<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쓰담 | 쓰레기 배출 인증</title>
  <style>
    :root{--navy:#075c78;--deep:#087b98;--mint:#ccf8f1;--coral:#ff786d;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--navy);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:linear-gradient(160deg,#bdf3ee,#73d6e5);display:grid;place-items:center;padding:16px}button{font:inherit;cursor:pointer;border:0}.phone{width:min(480px,100%);min-height:calc(100vh - 32px);padding:18px;border:3px solid rgba(255,255,255,.92);border-radius:32px;background:rgba(239,255,252,.85);box-shadow:0 12px 0 rgba(4,87,110,.18);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.back{width:45px;height:45px;border-radius:50%;background:#fff;color:var(--navy);font-size:28px;font-weight:bold}.top h1{margin:0;font-size:20px;letter-spacing:-1px}.camera{position:relative;overflow:hidden;flex:1;min-height:390px;border-radius:26px;background:linear-gradient(145deg,#77d6e1 0 28%,#daf8f2 28% 61%,#74bb8f 61%);border:4px solid #fff;box-shadow:inset 0 0 35px rgba(5,85,105,.25)}.camera:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(74deg,transparent 0 18px,rgba(255,255,255,.15) 19px 20px)}.sun{position:absolute;top:11%;right:13%;width:57px;height:57px;border-radius:50%;background:#ffe477;box-shadow:0 0 0 8px rgba(255,243,160,.35)}.sea{position:absolute;top:39%;width:120%;left:-10%;height:25%;background:repeating-radial-gradient(ellipse at 50% 0,#efffff 0 7px,#5fcee0 8px 16px);transform:rotate(-2deg)}.bin{position:absolute;bottom:16%;right:19%;width:74px;height:100px;border:5px solid #075c78;border-radius:7px 7px 13px 13px;background:#77c99d}.bin:before{content:"♻";display:grid;place-items:center;position:absolute;top:18px;left:10px;width:45px;height:45px;border-radius:50%;background:#effdf6;color:#16895c;font-size:27px}.bin:after{content:"";position:absolute;top:-15px;left:-6px;width:77px;height:15px;border-radius:10px;background:#075c78}.bottle{position:absolute;bottom:13%;left:18%;font-size:64px;transform:rotate(-20deg)}.leaf{position:absolute;bottom:9%;left:38%;font-size:55px}.frame{position:absolute;inset:25px;border:2px solid rgba(255,255,255,.75);border-radius:14px}.corner{position:absolute;width:24px;height:24px;border-color:white;border-style:solid}.c1{top:16px;left:16px;border-width:4px 0 0 4px}.c2{top:16px;right:16px;border-width:4px 4px 0 0}.c3{bottom:16px;left:16px;border-width:0 0 4px 4px}.c4{bottom:16px;right:16px;border-width:0 4px 4px 0}.rec{position:absolute;top:18px;left:20px;padding:7px 10px;border-radius:13px;background:rgba(0,54,71,.65);color:white;font-size:12px;font-weight:800}.dot{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%;background:#ff635b}.timer{position:absolute;top:19px;right:20px;padding:6px 10px;border-radius:13px;background:rgba(0,54,71,.65);color:white;font-weight:800;font-variant-numeric:tabular-nums}.hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:max-content;max-width:84%;padding:9px 13px;border-radius:18px;background:rgba(0,69,89,.7);color:white;text-align:center;font-size:13px;font-weight:bold}.controls{padding:19px 4px 2px;text-align:center}.status{min-height:22px;margin:0 0 13px;font-weight:800;font-size:14px}.record{width:73px;height:73px;border:6px solid white;border-radius:50%;background:#ff6f68;box-shadow:0 3px 0 #bb5754;transition:.15s}.record.recording{border-radius:20px;background:#ec4b50;transform:scale(.9)}.record:active{transform:translateY(3px)}.record.recording:active{transform:translateY(3px) scale(.9)}.record-label{display:block;margin-top:8px;font-weight:800}.verify{display:none;width:100%;margin-top:13px;padding:14px;border-radius:15px;background:var(--deep);color:white;font-weight:800;font-size:17px}.verify.show{display:block}.modal{display:none;position:fixed;inset:0;z-index:3;place-items:center;padding:22px;background:rgba(0,66,88,.45)}.modal.open{display:grid}.complete{width:min(360px,100%);padding:31px 22px;border:4px solid white;border-radius:28px;background:#eafff6;text-align:center;box-shadow:0 12px 0 rgba(0,65,84,.2)}.check{display:grid;place-items:center;width:78px;height:78px;margin:auto auto 15px;border-radius:50%;background:#76d4a3;color:white;font-size:45px;font-weight:bold}.complete h2{margin:0 0 10px}.complete p{line-height:1.7;font-weight:700}.complete strong{font-size:28px;color:#ef6c62}.count{color:#498396;font-size:13px}@media(min-width:600px){.phone{min-height:720px}}
  </style>
</head>
<body>
  <main class="phone">
    <header class="top"><button class="back" id="backButton" aria-label="첫 화면으로 돌아가기">‹</button><h1>쓰레기 배출 인증</h1><span style="width:45px"></span></header>
    <section class="camera" aria-label="쓰레기 인증 녹화 화면"><div class="sun"></div><div class="sea"></div><div class="bin"></div><div class="bottle">🧴</div><div class="leaf">🌿</div><div class="frame"></div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i><div class="rec"><span class="dot"></span>REC</div><div class="timer" id="timer">00:00</div><div class="hint" id="hint">쓰레기를 쓰레기통에 넣는 모습을 녹화해 주세요</div></section>
    <section class="controls"><p class="status" id="status">녹화 버튼을 눌러 시작해 주세요</p><button class="record" id="recordButton" aria-label="녹화 시작"></button><span class="record-label" id="recordLabel">녹화 시작</span><button class="verify" id="verifyButton">인증하기</button></section>
  </main>
  <div class="modal" id="completeModal"><section class="complete"><div class="check">✓</div><h2>인증이 완료되었어요!</h2><p>깨끗한 부산 바다를 만들어 준<br>쓰담이에게 선물을 보냈어.</p><strong>+500P</strong><p class="count"><span id="countdown">5</span>초 뒤 첫 화면으로 돌아가요</p></section></div>
  <script>
    let recording=false, seconds=0, interval;
    const recordButton=document.getElementById('recordButton'), timer=document.getElementById('timer'), status=document.getElementById('status'), label=document.getElementById('recordLabel'), hint=document.getElementById('hint'), verify=document.getElementById('verifyButton');
    const showTime=()=>{const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');timer.textContent=`${m}:${s}`};
    recordButton.onclick=()=>{recording=!recording;recordButton.classList.toggle('recording',recording);if(recording){status.textContent='녹화 중이에요. 배출 장면을 담아 주세요!';label.textContent='녹화 종료';hint.textContent='배출 장면을 천천히 보여 주세요';interval=setInterval(()=>{seconds++;showTime()},1000)}else{clearInterval(interval);status.textContent='녹화가 저장되었어요. 인증 버튼을 눌러 주세요!';label.textContent='다시 녹화하기';hint.textContent='인증할 준비가 되었어요';verify.classList.add('show')}};
    verify.onclick=()=>{const now=Number(localStorage.getItem('ssudamPoints')||0);localStorage.setItem('ssudamPoints',String(now+500));document.getElementById('completeModal').classList.add('open');let left=5;const count=document.getElementById('countdown');const go=setInterval(()=>{left--;count.textContent=left;if(left===0){clearInterval(go);location.href='index.html'}},1000)};
    document.getElementById('backButton').onclick=()=>location.href='index.html';
  </script>
</body>
</html>
